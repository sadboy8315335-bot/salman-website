<!DOCTYPE html>
<html>
<head>
<title>Salman Website</title>

<style>
body{
    margin:0;
    background:black;
    color:white;
    font-family:Arial, sans-serif;
    text-align:center;
    overflow-x:hidden;
}

nav{
    background:#111;
    padding:15px;
}

nav a{
    color:white;
    text-decoration:none;
    margin:20px;
    font-size:18px;
}

.hero{
    padding-top:80px;
}

.cricket{
    font-size:100px;
    animation:bounce 2s infinite;
}

@keyframes bounce{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-20px);}
}

.tiktok-btn{
    background:#ff0050;
    color:white;
    padding:15px 30px;
    text-decoration:none;
    border-radius:8px;
    font-size:20px;
    display:inline-block;
    margin-top:20px;
}

.ball{
    position:absolute;
    font-size:30px;
    animation:fall 8s linear infinite;
}

@keyframes fall{
    from{transform:translateY(-100px);}
    to{transform:translateY(100vh);}
}

.ball1{left:10%; animation-delay:0s;}
.ball2{left:30%; animation-delay:2s;}
.ball3{left:50%; animation-delay:4s;}
.ball4{left:70%; animation-delay:1s;}
.ball5{left:90%; animation-delay:3s;}

button{
    padding:10px 20px;
    font-size:18px;
    cursor:pointer;
    margin-top:10px;
}

#score{
    font-size:40px;
    font-weight:bold;
}
</style>

</head>
<body>

<div class="ball ball1">🏏</div>
<div class="ball ball2">🏏</div>
<div class="ball ball3">🏏</div>
<div class="ball ball4">🏏</div>
<div class="ball ball5">🏏</div>

<nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
</nav>

<div class="hero">

    <div class="cricket">🏏</div>

    <h1>My First Website</h1>

    <h2>I am Salman</h2>

    <h3>I am a Cricketer</h3>

    <h3>I am a Painter</h3>

    <p>Follow My TikTok Account</p>

    <h2>@cricketkingsalman</h2>

    <a class="tiktok-btn"
       href="https://www.tiktok.com/@cricketkingsalman"
       target="_blank">
       Follow on TikTok
    </a>

    <hr style="width:70%; margin-top:40px;">

    <h2>My Skills</h2>

    <ul style="list-style:none; font-size:22px;">
        <li>🏏 Cricket</li>
        <li>🎨 Painting</li>
        <li>💻 Web Development</li>
    </ul>

    <h2>Cricket Score Counter</h2>

    <p id="score">0</p>

    <button onclick="addRun()">+1 Run</button>

    <h2>Contact Me</h2>

    <p>Email: youremail@gmail.com</p>
    <p>Pakistan</p>

</div>

<script>
let score = 0;

function addRun() {
    score++;
    document.getElementById("score").innerText = score;
}
</script>

</body>
</html>
